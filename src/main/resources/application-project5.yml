spring:
  application:
    name: project5-hrm-payroll
  jpa:
    open-in-view: false

project5:
  database-name: ${PROJECT5_DATABASE_NAME:project5-hrm}
  jobs:
    reminder-delay-ms: ${PROJECT5_REMINDER_DELAY_MS:3600000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
